name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release
  queue: max
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require a release commit from main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Run offline checks and build
        run: make ci
      - name: Verify release archives and both snapshot images
        run: make release-package
      - name: Gate Go dependency vulnerabilities
        run: make security
      - name: Scan entire Git history for secrets
        run: >-
          docker run --rm --network none -v "$PWD:/src:ro"
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /src --redact --no-banner --log-level warn
      - name: Select and reserve the release tag
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags origin
          existing=$(git tag --points-at "$GITHUB_SHA" --list 'v[0-9]*')
          if [ -n "$existing" ]; then
            test "$(printf '%s\n' "$existing" | wc -l)" -eq 1
            tag=$existing
            if gh release view "$tag" --json isDraft --jq '.isDraft' > /tmp/repbridge-existing-release; then
              if grep -qx false /tmp/repbridge-existing-release; then
                echo 'This commit is already released.'
                echo 'skip=true' >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
          elif git describe --tags --match 'v[0-9]*' --abbrev=0 >/dev/null 2>&1; then
            tag=$(docker compose -f compose.release.yaml run --rm -T --entrypoint svu release next --always --v0 --tag.mode current)
          else
            tag=v0.1.0
          fi
          if [ -z "$existing" ]; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f "ref=refs/tags/$tag" -f "sha=$GITHUB_SHA"
            git tag "$tag" "$GITHUB_SHA"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Publish with GoReleaser in Docker
        if: steps.version.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}:$RELEASE_TAG"
          printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io' EXIT
          if docker manifest inspect "$image" > /tmp/repbridge-registry-check.log 2>&1; then
            echo 'Version image already exists; reconcile the existing publication before retrying.' >&2
            exit 1
          elif ! grep -Eiq 'manifest unknown|manifest_unknown|name_unknown|not found' /tmp/repbridge-registry-check.log; then
            echo 'Cannot establish image tag absence; refusing publication.' >&2
            exit 1
          fi
          docker compose -f compose.release.yaml run --build --rm -T --entrypoint sh publisher -ec '
            mkdir -p "$DOCKER_CONFIG"
            printf "%s" "$GITHUB_TOKEN" | docker login ghcr.io -u "$1" --password-stdin
            builder=$(docker buildx create --driver docker-container --use)
            trap "docker buildx rm $builder; docker logout ghcr.io" EXIT
            goreleaser release --clean
          ' sh "$GITHUB_ACTOR"
          # Upload every asset before publication locks an immutable release.
          gh release edit "$RELEASE_TAG" --draft=false --latest
