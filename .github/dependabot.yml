version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      compatible-go-dependencies:
        update-types: [patch, minor]
    ignore:
      # A Garmin bump needs a reviewed capability inventory and authorization audit.
      - dependency-name: github.com/ndeloof/go-garmin
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
