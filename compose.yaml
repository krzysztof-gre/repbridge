services:
  repbridge: &repbridge
    build: .
    image: "${REPBRIDGE_IMAGE:-repbridge:local}"
    init: true
    read_only: true
    cap_drop:
      - ALL
    group_add:
      - "${REPBRIDGE_HOST_GID:-20}"
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 256m
    cpus: 1.0
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      REPBRIDGE_AUTH_LISTEN_ADDRESS: "0.0.0.0:8787"
      REPBRIDGE_AUTH_PUBLIC_ORIGIN: "http://127.0.0.1:8787"
      REPBRIDGE_TOKEN_FILE: "/data/credentials.enc"
      REPBRIDGE_VAULT_KEY_FILE: "/run/secrets/repbridge-vault-key"
    volumes:
      - ./examples:/work:ro
      - ./policies:/etc/repbridge/policies:ro
      - repbridge-data:/data
      - type: bind
        source: "${REPBRIDGE_CONFIG_DIR:-${HOME}/.config/repbridge}/vault.key"
        target: /run/secrets/repbridge-vault-key
        read_only: true
        bind:
          create_host_path: false
    working_dir: /work

  mcp:
    <<: *repbridge
    profiles: [mcp]
    command: [mcp]
    ports: []
    stdin_open: true
    tty: false

  mcp-http:
    <<: *repbridge
    profiles: [http]
    command: [mcp, --transport, http]
    ports:
      - "127.0.0.1:8788:8080"
    volumes:
      - ./policies:/etc/repbridge/policies:ro
      - repbridge-data:/data
      - type: bind
        source: "${REPBRIDGE_CONFIG_DIR:-${HOME}/.config/repbridge}/vault.key"
        target: /run/secrets/repbridge-vault-key
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: "${REPBRIDGE_CONFIG_DIR:-${HOME}/.config/repbridge}/mcp.key"
        target: /run/secrets/repbridge-mcp-key
        read_only: true
        bind:
          create_host_path: false

  openai-gateway:
    <<: *repbridge
    profiles: [chatgpt]
    command: [mcp, --transport, tunnel]
    restart: unless-stopped
    stop_grace_period: 15s
    ports: []
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      REPBRIDGE_OPENAI_TUNNEL_ID: "${REPBRIDGE_OPENAI_TUNNEL_ID:-}"
      REPBRIDGE_OPENAI_API_KEY_FILE: /run/secrets/openai-runtime-key
    volumes:
      - ./policies:/etc/repbridge/policies:ro
      - repbridge-data:/data
      - type: bind
        source: "${REPBRIDGE_CONFIG_DIR:-${HOME}/.config/repbridge}/vault.key"
        target: /run/secrets/repbridge-vault-key
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: "${REPBRIDGE_CONFIG_DIR:-${HOME}/.config/repbridge}/openai-runtime.key"
        target: /run/secrets/openai-runtime-key
        read_only: true
        bind:
          create_host_path: false

  init-access:
    <<: *repbridge
    profiles: [setup]
    command: [init-access]
    ports: []
    volumes:
      - type: bind
        source: "${REPBRIDGE_CONFIG_DIR:-${HOME}/.config/repbridge}"
        target: /config
        bind:
          create_host_path: false

volumes:
  repbridge-data:
